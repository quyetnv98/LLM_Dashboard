version: '3.8'

services:
  backend:
    build:
      context: ./dashboard_be
      dockerfile: Dockerfile
    container_name: llm_dashboard_be
    ports:
      - "8021:8021"
    environment:
      - DB_PATH=/app/data/answer_db.db
    volumes:
      - ./data:/app/data
    restart: always

