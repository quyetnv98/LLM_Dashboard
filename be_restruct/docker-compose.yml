version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm_dashboard_be:latest
    container_name: c_llm_dashboard_be
    ports:
      - "8021:8021"
    environment:
      - DB_PATH=/app/data/answer_db.db
    volumes:
      - /CNC/LLM_Dashboard:/app/data
    restart: always
